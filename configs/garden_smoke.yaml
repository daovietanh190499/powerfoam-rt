# garden, 1/8 res, reduced for 6GB RTX 2060
# Experiment parameters
iterations: 5_000
densify_from: 500
densify_until: 4_000

# Dataset parameters
dataset: "colmap"
data_path: "../data/mipnerf360"
scene: "garden"
alpha_format_on_disk: "premultiplied"
downsample: [8, 8]
downsample_iterations: [0, 500]
is_pinhole: true
eval: true

# Model parameters
init_type: "sfm"
init_points: 100_000
final_points: 300_000
bkgd_color: [0.0, 0.0, 0.0]

# Optimization parameters
points_lr_init: 1e-3
points_lr_final: 1e-4
density_lr_init: 1e-1
density_lr_final: 1e-2
radii_lr_init: 1e-4
radii_lr_final: 1e-5

# VoroTracing-style
distortion_weight: 2e-2
