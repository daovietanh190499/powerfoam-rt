# Experiment parameters
iterations: 30_000
densify_from: 1_000
densify_until: 24_000

# Dataset parameters
dataset: "colmap"
data_path: "data/DTU"
scene: "scan55"
alpha_format_on_disk: "straight"
downsample: [2, 1]
downsample_iterations: [0, 500]
is_pinhole: true
eval: false

# Model parameters
init_type: "sfm"
init_points: 20_000
final_points: 50_000
bkgd_color: [0.0, 0.0, 0.0]

# Optimization parameters
points_lr_init: 1e-3
points_lr_final: 5e-5
density_lr_init: 1e0
density_lr_final: 1e0
radii_lr_init: 5e-5
radii_lr_final: 5e-6
